name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - spark-version: '3.5.8'
            scala-version: '2.12.21'
          - spark-version: '3.5.8'
            scala-version: '2.13.18'
          - spark-version: '4.0.2'
            scala-version: '2.13.18'
          - spark-version: '4.1.1'
            scala-version: '2.13.18'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Setup sbt
        uses: sbt/setup-sbt@75003863e039599afeb2c7042ef3f9dde98c091b # v1.1.23

      - name: Run tests
        run: sbt ++${{ matrix.scala-version }} -Dspark.version=${{ matrix.spark-version }} test
